<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Super Admin - Pendataan Peserta</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: "Segoe UI", Roboto, Arial, sans-serif; background: #f1f5f9; margin: 0; color: #0f172a; }
  header { background: #4f46e5; color: #fff; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  main { padding: 24px; max-width: 1300px; margin: auto; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .card { background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .card small { color: #64748b; font-size: 12px; text-transform: uppercase; font-weight: 700; }
  .card b { display: block; font-size: 26px; margin-top: 6px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
  .toolbar input, .toolbar select { padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; background: #fff; }
  .toolbar input { flex: 1; min-width: 220px; }
  .btn { padding: 10px 16px; border-radius: 8px; border: 1px solid #4f46e5; background: #4f46e5; color: #fff; font-weight: 700; cursor: pointer; font-size: 14px; }
  .btn.light { background: #fff; color: #4f46e5; }
  .btn.light.onDark { background: #fff; color: #4f46e5; border-color: #fff; }
  .btn-delete { padding: 6px 10px; border: 1px solid #dc2626; border-radius: 6px; background: #fff; color: #b91c1c; font-weight: 700; cursor: pointer; }
  .btn-delete:hover { background: #fef2f2; }
  .btn-delete:disabled { opacity: .55; cursor: wait; }
  .table-wrap { background: #fff; border-radius: 12px; overflow: auto; max-height: 70vh; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 10px 12px; border-bottom: 1px solid #e2e8f0; text-align: left; white-space: nowrap; }
  th { background: #f8fafc; font-size: 12px; text-transform: uppercase; color: #334155; position: sticky; top: 0; }
  .count { color: #64748b; font-size: 13px; margin: 6px 0 10px; }
  .login { max-width: 360px; margin: 14vh auto; background: #fff; padding: 28px; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.1); }
  .login h2 { margin: 0 0 6px; }
  .login p { color: #64748b; font-size: 14px; margin: 0; }
  .login input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; margin: 14px 0 8px; font-size: 15px; }
  .login .btn { width: 100%; }
  .err { color: #dc2626; font-size: 13px; min-height: 18px; }
  .hidden { display: none !important; }
  .view-tabs { display: flex; gap: 8px; margin-bottom: 16px; border-bottom: 1px solid #cbd5e1; }
  .view-tab { padding: 10px 14px; border: 0; border-bottom: 3px solid transparent; background: transparent; color: #475569; cursor: pointer; font: inherit; font-weight: 700; }
  .view-tab.active { color: #4f46e5; border-bottom-color: #4f46e5; }
  .chart-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-bottom: 20px; }
  .chart-panel { min-width: 0; background: #fff; border-radius: 8px; padding: 18px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .chart-panel h2 { margin: 0 0 14px; font-size: 16px; }
  .chart-list { display: grid; gap: 12px; }
  .chart-row { display: grid; grid-template-columns: minmax(90px, 1fr) minmax(80px, 2fr) 44px; align-items: center; gap: 10px; font-size: 13px; }
  .chart-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chart-track { height: 10px; overflow: hidden; border-radius: 5px; background: #e2e8f0; }
  .chart-fill { height: 100%; min-width: 0; border-radius: inherit; transition: width .25s ease; }
  .chart-value { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
  .chart-empty { color: #64748b; font-size: 13px; }
  @media (max-width: 700px) { main { padding: 16px; } .chart-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginView" class="login">
  <h2>Login Super Admin</h2>
  <p>Masukkan password admin untuk melihat data peserta.</p>
  <input type="password" id="pw" placeholder="Password admin" onkeydown="if(event.key==='Enter')login()">
  <button class="btn" onclick="login()">Masuk</button>
  <div class="err" id="loginErr"></div>
</div>

<!-- DASHBOARD -->
<div id="dashView" class="hidden">
  <header>
    <h1>Dashboard Pendataan Peserta</h1>
    <button class="btn light onDark" onclick="logout()">Keluar</button>
  </header>
  <main>
    <nav class="view-tabs" aria-label="Menu dashboard">
      <button type="button" class="view-tab" id="tabData" aria-selected="false" onclick="switchView('data')">Data Peserta</button>
      <button type="button" class="view-tab active" id="tabRecap" aria-selected="true" onclick="switchView('recap')">Rekap Hasil</button>
    </nav>
    <div class="cards">
      <div class="card"><small>Total peserta</small><b id="cTotal">0</b></div>
      <div class="card"><small>Peserta aktif</small><b id="cAktif">0</b></div>
      <div class="card"><small>Lulusan / Alumni</small><b id="cAlumni">0</b></div>
      <div class="card"><small>Bekerja di luar negeri</small><b id="cLN">0</b></div>
      <div class="card"><small>Tipe PKW</small><b id="cPKW">0</b></div>
      <div class="card"><small>Tipe PKK</small><b id="cPKK">0</b></div>
      <div class="card"><small>Program Mandiri</small><b id="cMandiri">0</b></div>
    </div>

    <div class="toolbar">
      <input id="q" placeholder="Cari nama, NIK, asal LKP, keterampilan..." oninput="render()">
      <select id="fProv" onchange="render()"><option value="">Semua provinsi</option></select>
      <select id="fTipe" onchange="render()">
        <option value="">Semua tipe</option><option>PKW</option><option>PKK</option><option>MANDIRI</option>
      </select>
      <select id="fTahun" onchange="render()"><option value="">Semua tahun bantuan</option></select>
      <select id="fStatus" onchange="render()">
        <option value="">Semua status</option><option>Peserta Aktif</option><option>Lulusan / Alumni</option>
      </select>
      <button class="btn light" onclick="loadData()">Muat ulang</button>
      <button class="btn" onclick="exportExcel()">Unduh Excel</button>
    </div>
    <section id="recapView" aria-label="Rekap hasil peserta">
      <div class="chart-grid">
        <section class="chart-panel"><h2>Peserta per Program</h2><div class="chart-list" id="chartProgram"></div></section>
        <section class="chart-panel"><h2>Status Peserta</h2><div class="chart-list" id="chartStatus"></div></section>
        <section class="chart-panel"><h2>Peserta per Provinsi</h2><div class="chart-list" id="chartProvinsi"></div></section>
        <section class="chart-panel"><h2>Peserta per Tahun Bantuan</h2><div class="chart-list" id="chartTahun"></div></section>
      </div>
    </section>
    <section id="tableView" class="hidden" aria-label="Data peserta">
      <div class="count" id="count"></div>
      <div class="table-wrap">
        <table>
          <thead><tr id="thead"></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<script>
const $ = id => document.getElementById(id);

const COLS = [
  ["created_at", "Waktu"], ["nik", "NIK"], ["nama", "Nama"], ["jenis_kelamin", "JK"],
  ["tanggal_lahir", "Tgl Lahir"], ["telepon", "Telepon"], ["pendidikan_terakhir", "Pendidikan"],
  ["provinsi", "Provinsi"], ["kabupaten_kota", "Kab/Kota"], ["tipe_program", "Tipe"],
  ["tahun_bantuan", "Tahun Bantuan"], ["jenis_keterampilan", "Keterampilan"],
  ["status_peserta", "Status"], ["asal_lkp", "Asal LKP"], ["tahun_lulus", "Tahun Lulus"],
  ["no_sertifikat", "No. Sertifikat"], ["status_bekerja", "Status Bekerja"],
  ["negara_tujuan", "Negara Tujuan"], ["nama_tempat_industri", "Tempat Industri Bekerja"],
  ["pekerjaan_negara_tujuan", "Pekerjaan LN"], ["ikut_pelepasan", "Ikut Pelepasan"],
  ["nama_pelepasan", "Nama Kegiatan Pelepasan"]
];

let data = [];
$("thead").innerHTML = COLS.map(c => "<th>" + c[1] + "</th>").join("");

function tampilkan(view) {
  $("loginView").classList.toggle("hidden", view !== "login");
  $("dashView").classList.toggle("hidden", view !== "dash");
}

function switchView(view) {
  const showRecap = view === "recap";
  $("recapView").classList.toggle("hidden", !showRecap);
  $("tableView").classList.toggle("hidden", showRecap);
  $("tabData").classList.toggle("active", !showRecap);
  $("tabRecap").classList.toggle("active", showRecap);
  $("tabData").setAttribute("aria-selected", String(!showRecap));
  $("tabRecap").setAttribute("aria-selected", String(showRecap));
}

async function login() {
  const r = await fetch("/api/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ password: $("pw").value })
  });
  if (r.ok) {
    $("pw").value = "";
    $("loginErr").textContent = "";
    loadData();
  } else {
    $("loginErr").textContent = "Password salah";
  }
}

async function logout() {
  await fetch("/api/logout", { method: "POST" });
  tampilkan("login");
}

async function loadData() {
  const r = await fetch("/api/peserta");
  if (r.status === 401) { tampilkan("login"); return; }
  const j = await r.json();
  data = j.rows || [];
  tampilkan("dash");
  isiFilter();
  renderStats();
  render();
}

function isiFilter() {
  const provs = [...new Set(data.map(d => d.provinsi).filter(Boolean))].sort();
  const tahun = [...new Set(data.map(d => d.tahun_bantuan).filter(Boolean))].sort((a, b) => b - a);
  const selP = $("fProv"), curP = selP.value;
  selP.innerHTML = '<option value="">Semua provinsi</option>' +
    provs.map(p => "<option>" + esc(p) + "</option>").join("");
  selP.value = curP;

  const selT = $("fTahun"), curT = selT.value;
  selT.innerHTML = '<option value="">Semua tahun bantuan</option>' +
    tahun.map(t => "<option>" + t + "</option>").join("");
  selT.value = curT;
}

function renderStats() {
  $("cTotal").textContent = data.length;
  $("cAktif").textContent = data.filter(d => d.status_peserta === "Peserta Aktif").length;
  $("cAlumni").textContent = data.filter(d => d.status_peserta === "Lulusan / Alumni").length;
  $("cLN").textContent = data.filter(d => d.status_bekerja === "Bekerja di Luar Negeri").length;
  $("cPKW").textContent = data.filter(d => d.tipe_program === "PKW").length;
  $("cPKK").textContent = data.filter(d => d.tipe_program === "PKK").length;
  $("cMandiri").textContent = data.filter(d => d.tipe_program === "MANDIRI").length;
}

function filtered() {
  const q = $("q").value.trim().toLowerCase();
  return data.filter(d => {
    if ($("fProv").value && d.provinsi !== $("fProv").value) return false;
    if ($("fTipe").value && d.tipe_program !== $("fTipe").value) return false;
    if ($("fTahun").value && String(d.tahun_bantuan) !== $("fTahun").value) return false;
    if ($("fStatus").value && d.status_peserta !== $("fStatus").value) return false;
    if (q) {
      const teks = [d.nama, d.nik, d.asal_lkp, d.jenis_keterampilan, d.provinsi].join(" ").toLowerCase();
      if (!teks.includes(q)) return false;
    }
    return true;
  });
}

function render() {
  const rows = filtered();
  $("count").textContent = "Menampilkan " + rows.length + " dari " + data.length + " data";
  $("tbody").innerHTML = rows.map(d =>
    "<tr>" + COLS.map(c => "<td>" + esc(fmt(c[0], d[c[0]])) + "</td>").join("") + "</tr>"
  ).join("");
  renderCharts(rows);
}

function chartEntries(rows, key, fixedLabels) {
  const counts = new Map();
  rows.forEach(row => {
    const label = row[key];
    if (label !== null && label !== undefined && String(label).trim()) {
      const value = String(label);
      counts.set(value, (counts.get(value) || 0) + 1);
    }
  });
  if (fixedLabels) return fixedLabels.map(label => [label, counts.get(label) || 0]);
  return [...counts.entries()].sort((a, b) => b[1] - a[1]);
}

function renderChart(id, entries, colors) {
  const list = $(id);
  if (!entries.length) {
    list.innerHTML = '<div class="chart-empty">Belum ada data untuk filter ini.</div>';
    return;
  }
  const max = Math.max(...entries.map(([, count]) => count), 1);
  list.innerHTML = entries.map(([label, count], index) => {
    const width = count ? Math.max(3, count / max * 100) : 0;
    return '<div class="chart-row"><span class="chart-label" title="' + esc(label) + '">' + esc(label) +
      '</span><div class="chart-track"><div class="chart-fill" style="width:' + width + '%;background:' + colors[index % colors.length] +
      '"></div></div><span class="chart-value">' + count + '</span></div>';
  }).join("");
}

function renderCharts(rows) {
  renderChart("chartProgram", chartEntries(rows, "tipe_program", ["PKW", "PKK", "MANDIRI"]), ["#e76f51", "#2a9d8f", "#e9a23b"]);
  renderChart("chartStatus", chartEntries(rows, "status_peserta", ["Peserta Aktif", "Lulusan / Alumni"]), ["#2878b5", "#7c6bb1"]);
  renderChart("chartProvinsi", chartEntries(rows, "provinsi").slice(0, 8), ["#2a9d8f", "#e76f51", "#2878b5", "#e9a23b"]);
  const years = chartEntries(rows, "tahun_bantuan").sort((a, b) => Number(b[0]) - Number(a[0])).slice(0, 8);
  renderChart("chartTahun", years, ["#2878b5", "#2a9d8f", "#e76f51", "#e9a23b"]);
}

function fmt(key, val) {
  if (val === null || val === undefined) return "";
  if (key === "created_at") return new Date(val).toLocaleString("id-ID", { timeZone: "Asia/Jakarta" });
  if (key === "tanggal_lahir") return String(val).slice(0, 10);
  return String(val);
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
}

function xmlEsc(value) {
  return String(value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&apos;");
}

function exportExcel() {
  const rows = filtered();
  const header = "<Row>" + COLS.map(c => '<Cell ss:StyleID="Header"><Data ss:Type="String">' + xmlEsc(c[1]) + "</Data></Cell>").join("") + "</Row>";
  const body = rows.map(row => "<Row>" + COLS.map(c => '<Cell><Data ss:Type="String">' + xmlEsc(fmt(c[0], row[c[0]])) + "</Data></Cell>").join("") + "</Row>").join("");
  const workbook = '<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?>' +
    '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">' +
    '<Styles><Style ss:ID="Header"><Font ss:Bold="1"/><Interior ss:Color="#DCE6F1" ss:Pattern="Solid"/></Style></Styles>' +
    '<Worksheet ss:Name="Data Peserta"><Table>' + header + body + "</Table></Worksheet></Workbook>";
  const blob = new Blob(["\uFEFF" + workbook], { type: "application/vnd.ms-excel;charset=utf-8" });
  const a = document.createElement("a");
  const url = URL.createObjectURL(blob);
  a.href = url;
  a.download = "data-peserta-" + new Date().toISOString().slice(0, 10) + ".xls";
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

loadData();
</script>
</body>
</html>
